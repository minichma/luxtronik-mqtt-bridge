name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.9'
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mosquitto -y --no-progress
          'C:\Program Files\mosquitto' | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests tools
      - run: uv run --locked ruff format --check src tests tools
      - run: uv run --locked pytest -q
